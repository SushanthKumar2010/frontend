<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- Your existing CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-container" style="max-width: 420px;">
    
    <!-- Header -->
    <div class="app-header">
      <h1>Welcome Back</h1>
      <p>Login to continue</p>
    </div>

    <!-- Login Card -->
    <div class="controls" style="flex-direction: column; gap: 12px;">

      <!-- Username -->
      <div class="control-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter your username"
          required
          style="padding: 6px 8px; border-radius: 6px; border: 1px solid #374151; background:#020617; color:#e5e7eb; font-size:0.85rem;"
        />
      </div>

      <!-- Password -->
      <div class="control-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          style="padding: 6px 8px; border-radius: 6px; border: 1px solid #374151; background:#020617; color:#e5e7eb; font-size:0.85rem;"
        />
      </div>

      <!-- Login Button -->
      <button id="sendBtn" style="height: 36px;">
        Login
      </button>

      <!-- Extra -->
      <p style="font-size:0.7rem; color:#9ca3af; text-align:center;">
        Don’t have an account? <span style="color:#2563eb; cursor:pointer;">Sign up</span>
      </p>

    </div>
  </div>

</body>
</html>
